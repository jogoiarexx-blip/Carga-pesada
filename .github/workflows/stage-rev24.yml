name: Preparar revisão 24
on:
  push:
    branches:
      - feature/imperador-frontal-v024
permissions:
  contents: write
jobs:
  expandir-pacote-revisao:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Conferir integridade do pacote
        run: |
          echo 'e31c8e335e1668df63d60fba30e73aa2b59202631e61af5945a83914ecca6f8d  source/_rev24.tgz' | sha256sum -c
          tar -tzf source/_rev24.tgz
      - name: Descompactar novos módulos testados
        run: |
          set -euo pipefail
          tar -xzf source/_rev24.tgz -C .
          node --check source/src/imperador-frontal.mjs
          node --check source/tests/imperador-frontal.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src/imperador-frontal.mjs source/tests/imperador-frontal.test.mjs source/docs/REV24_IMPERADOR_FRONTAL_REALISTA.md
          git diff --cached --quiet && { echo 'Fontes já instalados'; exit 0; }
          git commit -m 'feat(rev24): importar cabine e testes Imperador Frontal'
          git push origin HEAD:feature/imperador-frontal-v024

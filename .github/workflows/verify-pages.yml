name: Verificar versão publicada do Carga Pesada
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir JavaScript compilado
        run: |
          node -e 'const fs=require("fs"),cp=require("child_process"),h=fs.readFileSync("index.html","utf8"),m=h.match(/\.\/assets\/index-[\w-]+\.js/);if(!m)throw Error("JavaScript compilado não encontrado");cp.execFileSync(process.execPath,["--check",m[0]],{stdio:"inherit"});'
      - name: Conferir service worker
        run: node --check sw.js
      - name: Testar integridade do GitHub Pages
        run: node --test tests/pages-smoke.test.mjs

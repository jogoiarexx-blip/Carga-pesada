name: Publicar jogo Vite no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/publish-vite.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: carga-pesada-publicacao
  cancel-in-progress: false

jobs:
  publicar-versao-compilada:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Instalar Vite
        working-directory: source
        run: npm ci

      - name: Executar testes da carreira e menu
        working-directory: source
        run: npm test

      - name: Gerar versão de produção
        working-directory: source
        run: npm run build

      - name: Verificar integridade e caminhos do Pages
        working-directory: source
        run: npm run check:dist

      - name: Atualizar arquivos estáticos da raiz
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test -f source/dist/index.html
          test -f source/dist/sw.js
          test -d source/dist/assets
          rsync -a source/dist/ ./
          cmp source/dist/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets/ sw.js manifest.webmanifest icons/ THIRD_PARTY_THREE.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma mudança na build publicada."
          else
            git commit -m "build: publicar menu principal REV18 compilado"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Solicitar atualização do Pages configurado por branch
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/pages-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "Pages build request HTTP $status"
          if [[ "$status" != "201" && "$status" != "202" ]]; then
            echo "::warning::Requisição de build Pages não aceita; verificar se houve publicação automática pelo commit."
            head -c 500 /tmp/pages-response.txt || true
          fi
